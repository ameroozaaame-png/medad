<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنت دون اتصال — مِداد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Tajawal',sans-serif;background:#0f0d1a;color:#f7f1e3;margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.card{background:#211c3f;border:1px solid rgba(212,175,106,.22);border-radius:18px;padding:32px;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
h1{font-size:26px;margin-bottom:10px}
p{color:#a9a3c7;line-height:1.8}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;padding:12px 20px;border-radius:14px;font-size:15px;margin-top:16px;background:linear-gradient(135deg,#f0d9a8,#d4af6a);color:#1a1405}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:64px">📡</div>
  <h1>أنت دون اتصال</h1>
  <p>لا يوجد اتصال بالإنترنت. بياناتك محفوظة محليًا — يمكنك متابعة الكتابة، وسيُزامن كل شيء عند عودة الاتصال.</p>
  <button class="btn" onclick="location.reload()">🔄 إعادة المحاولة</button>
</div>
</body>
</html>
